<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-label="Liu Huaxi hero">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07070a"/>
      <stop offset="50%" stop-color="#171104"/>
      <stop offset="100%" stop-color="#07070a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#FFD700" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFE58A"/>
      <stop offset="50%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#C9971A"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1000" height="340" fill="url(#bg)"/>
  <rect width="1000" height="340" fill="url(#grid)"/>
  <rect width="1000" height="340" fill="url(#glow)"/>

  <!-- corner brackets -->
  <g stroke="#FFD700" stroke-opacity="0.65" stroke-width="2" fill="none">
    <path d="M30 30 h34 M30 30 v24"/><path d="M970 30 h-34 M970 30 v24"/>
    <path d="M30 310 h34 M30 310 v-24"/><path d="M970 310 h-34 M970 310 v-24"/>
  </g>

  <!-- circuit traces -->
  <g stroke="#FFD700" fill="none" filter="url(#soft)">
    <path d="M80 268 H300 L340 232 H520" stroke-opacity="0.35"/>
    <path d="M920 84 H700 L660 120 H560" stroke-opacity="0.30"/>
    <path d="M140 60 H260 L300 96 H420" stroke-opacity="0.25"/>
  </g>
  <g fill="#FFD700">
    <circle cx="80" cy="268" r="4" fill-opacity="0.8"/><circle cx="520" cy="232" r="3" fill-opacity="0.7"/>
    <circle cx="920" cy="84" r="4" fill-opacity="0.8"/><circle cx="560" cy="120" r="3" fill-opacity="0.7"/>
    <circle cx="140" cy="60" r="3" fill-opacity="0.6"/><circle cx="420" cy="96" r="3" fill-opacity="0.6"/>
  </g>

  <!-- floating particles -->
  <g fill="#FFD700">
    <circle cx="200" cy="180" r="2" fill-opacity="0.5"/><circle cx="760" cy="250" r="2.5" fill-opacity="0.5"/>
    <circle cx="640" cy="60" r="2" fill-opacity="0.4"/><circle cx="840" cy="170" r="2" fill-opacity="0.35"/>
    <circle cx="330" cy="290" r="2" fill-opacity="0.35"/><circle cx="90" cy="150" r="1.8" fill-opacity="0.4"/>
  </g>

  <!-- hex accents -->
  <g fill="none" stroke="#FFD700" stroke-opacity="0.35" stroke-width="1.5">
    <path d="M930 300 l14 8 v16 l-14 8 -14 -8 v-16 z"/>
    <path d="M70 90 l14 8 v16 l-14 8 -14 -8 v-16 z" stroke-opacity="0.25"/>
  </g>

  <text x="500" y="158" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="66" font-weight="700" fill="url(#title)" filter="url(#soft)">刘华西</text>
  <text x="500" y="204" text-anchor="middle" font-family="Fira Code, Consolas, monospace" font-size="30" letter-spacing="8" fill="#FFE9A8">LIU HUAXI</text>
  <text x="500" y="250" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#EAD48A">虚幻引擎开发工程师  ·  Unreal Engine Engineer</text>
  <text x="500" y="288" text-anchor="middle" font-family="Fira Code, monospace" font-size="14" fill="#B99A45">ZS_Live · Cloud Rendering &amp; Streaming</text>

  <line x1="60" y1="308" x2="940" y2="308" stroke="url(#title)" stroke-opacity="0.5" stroke-width="1.5"/>
</svg>